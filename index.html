<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1a33">
<title>Gues Chemi · General Chemistry</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button type="button" class="ic menu" id="menuBtn" aria-label="القائمة" hidden><span></span><span></span><span></span></button>
  <a class="brand" href="#/" aria-label="Gues Chemi">
    <img src="logo.webp" alt="" width="34" height="34">
    <span><b>GUES CHEMI</b><small>General Chemistry · 1st-year Pharmacy</small></span>
  </a>
  <div class="user" id="user"></div>
</header>

<div class="shell" id="shell">
  <aside class="side" id="side" hidden></aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main" tabindex="-1">
    <section id="gate" class="gate-wrap"><div class="gate"><div class="card"><p>جارٍ التحميل…</p></div></div></section>
    <section id="view" hidden></section>
  </main>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="عرض الصفحة">
  <div class="vbar">
    <button type="button" class="vb" data-v="close" aria-label="إغلاق">✕</button>
    <span class="vt" id="vtitle"></span>
    <button type="button" class="vb" data-v="out" aria-label="تصغير">−</button>
    <span class="vz" id="vzoom">100%</span>
    <button type="button" class="vb" data-v="in" aria-label="تكبير">+</button>
    <button type="button" class="vb" data-v="rot" aria-label="تدوير">⟳</button>
  </div>
  <div class="vscroll" id="vscroll"><div class="vstage" id="vstage"></div></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
